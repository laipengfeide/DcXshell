[package]
name = "dc-xshell"
version = "1.0.0"
description = "Dc Xshell - 无需 USB Key 的 SSH 终端客户端"
authors = ["Dc Xshell <dev@dcxshell.local>"]
edition = "2021"
default-run = "dc-xshell"

[build-dependencies]
# 固定到兼容 rustc 1.89 的版本（2.7+ 要求 rustc 1.90）
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-dialog = "=2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
rusqlite = { version = "0.41", features = ["bundled"] }
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "1"
bytes = "1"
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
# 本地 SSH 测试服务（src/bin/sshtest.rs）仅在显式开启该 feature 时构建，避免随安装包分发
test-server = []

[[bin]]
name = "sshtest"
path = "src/bin/sshtest.rs"
required-features = ["test-server"]
